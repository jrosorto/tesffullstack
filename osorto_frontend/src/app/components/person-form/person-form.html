<div class="container">
  <h1>{{ isEdit() ? 'Editar Persona' : 'Nueva Persona' }}</h1>

  @if (errorMsg()) {
    <div class="alert alert-error">{{ errorMsg() }}</div>
  }

  @if (loading()) {
    <div class="loading">Cargando...</div>
  } @else {
    <form (ngSubmit)="save()" #personForm="ngForm">
      <div class="form-group">
        <label for="nombre">Nombre *</label>
        <input id="nombre" name="nombre" type="text" [(ngModel)]="person.nombre" required placeholder="Ingresa el nombre" />
      </div>

      <div class="form-group">
        <label for="apellido">Apellido *</label>
        <input id="apellido" name="apellido" type="text" [(ngModel)]="person.apellido" required placeholder="Ingresa el apellido" />
      </div>

      <div class="form-group">
        <label for="fechaNacimiento">Fecha de Nacimiento</label>
        <input id="fechaNacimiento" name="fechaNacimiento" type="date" [(ngModel)]="person.fechaNacimiento" />
      </div>

      <div class="form-group">
        <label for="puesto">Puesto *</label>
        <input id="puesto" name="puesto" type="text" [(ngModel)]="person.puesto" required placeholder="Ingresa el puesto" />
      </div>

      <div class="form-group">
        <label for="sueldo">Sueldo</label>
        <input id="sueldo" name="sueldo" type="number" [(ngModel)]="person.sueldo" min="0" step="0.01" placeholder="0.00" />
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="loading()">
          {{ loading() ? 'Guardando...' : 'Guardar' }}
        </button>
        <button type="button" class="btn btn-secondary" (click)="cancel()">Cancelar</button>
      </div>
    </form>
  }
</div>
